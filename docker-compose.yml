services:
  baoguan-backend:
    build: .
    image: baoguan-backend:latest
    container_name: baoguan-backend
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - ./scripts/generated:/app/scripts/generated
